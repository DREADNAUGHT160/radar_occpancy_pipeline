experiment_name: rc019_hires

# Higher vertical resolution (128 height bins vs default 64) + focal_dice loss.
# Labels must be regenerated before training:
#
#   python dataset/generate_lidar_labels.py \
#     --radar_npy_dir  "D:/dataset/RC019" \
#     --lidar_pcd_dir  "<path_to_raw_lidar_h5_files>" \
#     --out_dir        "D:/dataset/RC019/labels_128h" \
#     --height_bins    128
#
# Then run training:
#   conda activate thesis_model
#   python training/train.py --config configs/train_config_rc019_hires.yaml

dataset:
  raw_data_dir: ''
  base_dir: 'D:/dataset/'

  subfolders:
    rad_power: rad_power_pooled   # use pre-pooled for speed
    rad_elev:  rad_elev_pooled
    labels:    labels_128h        # ← regenerated at 128 height bins
    pco:       pco
    calib:     calib

  auto_split:
    enabled: false

  train:
    - RC019
  val:
    - RC019
  test:
    - RC019

  batch_size: 1         # keep low on Windows GPU
  num_workers: 2
  augmentations: false
  sync_threshold_ms: 100
  filter_bboxes: false
  label_text_dir: ''

  normalization:
    enable: true
    auto_normalization: false
    power_log_transform: true
    power_min_val: -100.0
    power_max_val: -31.7
    normalize_elevation: false
    elevation_max_angle: 0.7854
    no_clipping: false
    mask_elevation: false
    power_threshold: -60.0

model:
  name: resnet18_radar
  in_channels: 2
  doppler_depth: 128
  use_full_doppler: false
  encoder_out_channels: 64
  num_classes: 128          # ← must match --height_bins used in label generation
  doppler_pool: max
  elev_pool: max

training:
  epochs: 10
  lr: 0.001
  optimizer: Adam
  weight_decay: 1e-4
  scheduler: CosineAnnealingLR
  loss: focal_dice          # focal + dice — better for sparse imbalanced occupancy
  focal_alpha: 0.25
  focal_gamma: 2.0
  dice_weight: 0.5
  # Uncomment to use pure focal loss instead:
  # loss: focal

logging:
  output_dir: checkpoints_rc019_hires
  tensorboard: true

check_data:
  split: train
  n_plots: 3

inference:
  checkpoint: ''
  threshold: null
  out_dir: verification_output_rc019_hires
  saveroad_dir: ''
