experiment_name: rc019_pipeline_test

dataset:
  raw_data_dir: ''
  base_dir: 'D:/dataset/'

  subfolders:
    rad_power: rad_power
    rad_elev:  rad_elev
    labels:    labels
    pco:       pco
    calib:     calib

  auto_split:
    enabled: false
    train_ratio: 0.70
    val_ratio: 0.15
    seed: 42

  train:
    - RC019

  val:
    - RC019

  test:
    - RC019

  batch_size: 2
  num_workers: 2
  augmentations: true
  sync_threshold_ms: 100
  filter_bboxes: false
  label_text_dir: ''

  normalization:
    enable: true
    auto_normalization: false
    power_log_transform: true
    power_min_val: -100.0
    power_max_val: -31.7
    normalize_elevation: false
    elevation_max_angle: 0.7854
    no_clipping: false
    mask_elevation: false
    power_threshold: -60.0

model:
  name: resnet18_radar
  in_channels: 2
  doppler_depth: 128
  use_full_doppler: false
  encoder_out_channels: 64
  num_classes: 64
  doppler_pool: max

training:
  epochs: 2
  lr: 0.001
  optimizer: Adam
  weight_decay: 1e-4
  scheduler: CosineAnnealingLR
  loss: weighted_bce
  pos_weight: 10.0

logging:
  output_dir: checkpoints_rc019_test
  tensorboard: true

check_data:
  split:   train
  n_plots: 3

inference:
  checkpoint: ''
  threshold: null
  out_dir: verification_output_rc019_test
  saveroad_dir: ''
