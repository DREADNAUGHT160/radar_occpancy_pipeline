# =============================================================================
# Thesis Evaluation Config
# =============================================================================
#
# Steps:
#   1. Set checkpoint and base_dir below
#   2. Fill in eval_splits with your RC folders by weather condition
#   3. Set raw_data_dir if you need to run update_calib_cfar.py
#   4. Set eval_mode:  'basic'   -> quick sanity check on one RC folder
#                      'weather' -> full thesis evaluation across all RC folders
#   5. Run:  python utils/thesis_eval.py --config configs/eval_config.yaml
# =============================================================================


# ── Model checkpoint ──────────────────────────────────────────────────────────
checkpoint: 'checkpoints/20260626_125729/best_model.pth'

model:
  name: resnet18_radar
  in_channels: 2
  doppler_depth: 128
  use_full_doppler: false
  encoder_out_channels: 64
  num_classes: 64


# ── Dataset paths ─────────────────────────────────────────────────────────────
# Root of the prepared dataset (created by prepare_dataset.py).
base_dir: '/media/SSD2/radar_dataset/'

# Root of the original SAVEROAD raw data collections (needed for update_calib_cfar.py).
# Leave empty if not running that script.
raw_data_dir: ''   # e.g. '/media/SSD2/raw_collections/'

# Path to CFAR files inside each raw SAVEROAD source folder.
cfar_src_subfolder: 'data/radar'

# Path to the SAVEROAD_DataLoader toolkit (needed for camera projection figures).
# Leave empty to skip camera projection.
saveroad_dir: ''   # e.g. '/media/SSD2/SAVEROAD_DataLoader'

subfolders:
  rad_power: rad_power
  rad_elev:  rad_elev
  labels:    labels
  pco:       pco
  calib:     calib
  cfar:      cfar


# ── Normalization (must match training settings) ───────────────────────────────
normalization:
  enable: true
  auto_normalization: false
  power_log_transform: true
  power_min_val: -100.0
  power_max_val: -31.7
  normalize_elevation: false
  elevation_max_angle: 0.7854
  mask_elevation: false
  power_threshold: -60.0


# ── Evaluation datasets ────────────────────────────────────────────────────────
# Test split — model has never seen these RC folders.
# Training used:   RC002-RC008, RC014-RC016, RC020-RC022, RC029-RC030,
#                  RC041-RC043, RC050-RC054, RC062-RC073
# Validation used: RC009-RC013
# Move RC folders between conditions to match actual recording weather.
eval_splits:
  clear: [RC019, RC031, RC032, RC033, RC036]   # all test RCs set to clear for now
  fog:   []    # move fog RC folders here when weather data is available
  rain:  []    # move rain RC folders here when weather data is available


# ── Evaluation mode ───────────────────────────────────────────────────────────
# basic   -> quick sanity check: IoU / Precision / Recall on one RC folder
# weather -> full thesis evaluation: AP, P_d, P_fa, CD, degradation, figures
eval_mode: weather   # change to 'basic' for quick check

# Set false to skip AP/P_d/P_fa/CD metrics and only generate camera projection
# figures. Use this to avoid OOM when running camera projection on the full dataset.
eval_metrics: false


# ── Basic mode settings ───────────────────────────────────────────────────────
basic:
  threshold: 0.4


# ── Weather mode settings ─────────────────────────────────────────────────────
weather:
  threshold: 0.4


# ── Thesis figures ────────────────────────────────────────────────────────────
thesis_plots:
  enable:            true
  n_plots:           5       # frames per RC folder (equally spaced)
  raw_prediction:    true    # true -> raw probability output; false -> apply threshold
  threshold:         0.4     # used only when raw_prediction: false
  # Set camera_projection: true to generate 2-panel DL-vs-CFAR camera overlay figures.
  # Requires pco/ and calib/ subfolders in each RC folder (standard prepared dataset layout).
  # Output: <out_dir>/camera_projection/<rc_name>/frame_NN_rangeX.Xm.png
  camera_projection: true


# ── Output ────────────────────────────────────────────────────────────────────
out_dir: verification_output/eval
