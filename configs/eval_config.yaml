# ── Model ──────────────────────────────────────────────────────────────────────
model:
  name: resnet18_radar
  in_channels: 2
  doppler_depth: 128
  use_full_doppler: false
  encoder_out_channels: 64
  num_classes: 64

checkpoint: 'D:/thesis data/thesis/model_pipeline/checkpoints/20260417_090255/best_model.pth'

# ── Dataset ─────────────────────────────────────────────────────────────────────
base_dir: 'D:/dataset'     # root folder containing RC sub-folders, e.g. D:/dataset

subfolders:
  rad_power: rad_power
  rad_elev:  rad_elev
  labels:    labels
  calib:     calib

normalization:
  enable: true
  auto_normalization: false
  power_log_transform: true
  power_min_val: -100.0
  power_max_val: -31.7
  normalize_elevation: false
  elevation_max_angle: 0.7854
  mask_elevation: false
  power_threshold: -60.0

# ── Evaluation mode ─────────────────────────────────────────────────────────────
#
# basic  — Load model on clear-weather data and compute per-voxel
#          IoU / Precision / Recall against LiDAR GT labels.
#          Use this to verify the model is working correctly before
#          running the full thesis evaluation.
#
# weather — Full thesis evaluation:
#           AP, P_d, P_fa, Chamfer Distance, degradation %, point density
#           across clear / fog / rain, comparing DL model vs CFAR.
#
eval_mode: basic   # 'basic'  or  'weather'

# ── Basic mode settings ─────────────────────────────────────────────────────────
basic:
  dataset: 'RC019'
  threshold: 0.4   # occupancy threshold for binarising predictions

# ── Weather mode settings ───────────────────────────────────────────────────────
weather:
  threshold: 0.4

  weather_splits:
    clear: []      # e.g. [RC_clear]
    fog:   []      # e.g. [RC_fog]
    rain:  []      # e.g. [RC_rain]

  # Root folder for CFAR point clouds.
  # Expected layout:  cfar_dir/<RC_folder>/<timestamp>.npy
  # File format:  (N,3) float32 XYZ  or  (N,4) XYZ+confidence
  cfar_dir: ''

# ── Prediction plots (eval_plots.py) ────────────────────────────────────────────
# Generates equally spaced 4-row mosaic plots:
#   Row 1: radar input (BEV, AE map, RE map)
#   Row 2: ground-truth occupancy (BEV, front, side)
#   Row 3: raw prediction probability (BEV, front, side)
#   Row 4: thresholded prediction (BEV, front, side)
eval_plots:
  dataset:   'RC019'
  n_plots:   10
  threshold: 0.4
  pco_dir:   'C:/Users/evinb/Desktop/thesis/SAVEROAD_DataLoader/18_RC019/data/pco'

# ── Camera projection check (camera_check.py) ────────────────────────────────────
# Projects predicted occupancy grid onto camera images for visual verification.
# Generates equally spaced side-by-side plots: original image vs radar overlay.
camera:
  dataset:     ''    # RC folder, e.g. RC_clear
  n_plots:     10    # number of equally spaced frames
  threshold:   0.4
  saveroad_dir: 'C:/Users/evinb/Desktop/thesis/SAVEROAD_DataLoader'
  pco_dir:     ''    # folder containing .jpg camera images
  calib_dir:   ''    # folder with .txt calib files (auto-detected as <dataset>/calib if empty)

# ── Output ──────────────────────────────────────────────────────────────────────
out_dir: verification_output/eval
