# =============================================================================
# Full Weather Evaluation Config
# Runs AP / P_d / P_fa / Chamfer Distance across all eval_splits conditions,
# degradation table (clear → fog/rain), range-band breakdown, and thesis figures.
#
# Usage:
#   python utils/thesis_eval.py --config configs/eval_weather.yaml
# =============================================================================

checkpoint: 'checkpoints/20260626_125729/best_model.pth'

model:
  name: resnet18_radar
  in_channels: 2
  doppler_depth: 128
  use_full_doppler: false
  encoder_out_channels: 64
  num_classes: 64

base_dir: '/media/SSD2/radar_dataset/'
raw_data_dir: ''
cfar_src_subfolder: 'data/radar'

# Path to the SAVEROAD_DataLoader toolkit folder (needed for camera projection figures).
# Leave empty to skip camera projection and only generate prediction mosaic plots.
saveroad_dir: ''   # e.g. '/media/SSD2/SAVEROAD_DataLoader'

subfolders:
  rad_power: rad_power
  rad_elev:  rad_elev
  labels:    labels
  pco:       pco
  calib:     calib
  cfar:      cfar

normalization:
  enable: true
  auto_normalization: false
  power_log_transform: true
  power_min_val: -100.0
  power_max_val: -31.7
  normalize_elevation: false
  elevation_max_angle: 0.7854
  mask_elevation: false
  power_threshold: -60.0

eval_mode: weather

# Test split from training log — model has never seen these RC folders.
# Training used:   RC002-RC008, RC014-RC016, RC020-RC022, RC029-RC030,
#                  RC041-RC043, RC050-RC054, RC062-RC073
# Validation used: RC009-RC013
# Move RC folders between conditions to match actual recording weather.
eval_splits:
  clear: [RC019, RC031, RC032, RC033, RC036]   # RC019 confirmed clear; check others
  fog:   []    # move fog RC folders here
  rain:  []    # move rain RC folders here

weather:
  threshold: 0.4

thesis_plots:
  enable:            true
  n_plots:           5
  raw_prediction:    true
  threshold:         0.4
  camera_projection: false   # set true and fill in saveroad_dir above to enable

out_dir: verification_output/weather
