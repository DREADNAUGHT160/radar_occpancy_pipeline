checkpoint: 'D:/thesis data/thesis/model_pipeline/checkpoints/20260417_090255/best_model.pth'

model:
  name: resnet18_radar
  in_channels: 2
  doppler_depth: 128
  use_full_doppler: false
  encoder_out_channels: 64
  num_classes: 64

base_dir: 'D:/dataset'

raw_data_dir: ''
cfar_src_subfolder: 'data/radar'
saveroad_dir: ''

subfolders:
  rad_power: rad_power
  rad_elev:  rad_elev
  labels:    labels
  pco:       pco
  calib:     calib
  cfar:      cfar

normalization:
  enable: true
  auto_normalization: false
  power_log_transform: true
  power_min_val: -100.0
  power_max_val: -31.7
  normalize_elevation: false
  elevation_max_angle: 0.7854
  mask_elevation: false
  power_threshold: -60.0

eval_splits:
  clear: [RC019]
  fog:   []
  rain:  []

eval_mode: weather
eval_metrics: true

basic:
  threshold: 0.4

weather:
  threshold: 0.4

thesis_plots:
  enable:            false

out_dir: verification_output/eval_rc019_windows
