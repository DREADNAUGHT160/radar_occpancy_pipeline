# =============================================================================
# Basic Evaluation Config
# Quick sanity check — per-voxel IoU / Precision / Recall on one RC folder.
# Run this first to confirm the model loads and predicts correctly.
#
# Usage:
#   python utils/thesis_eval.py --config configs/eval_basic.yaml
# =============================================================================

checkpoint: 'checkpoints/20260626_125729/best_model.pth'

model:
  name: resnet18_radar
  in_channels: 2
  doppler_depth: 128
  use_full_doppler: false
  encoder_out_channels: 64
  num_classes: 64

base_dir: '/media/SSD2/radar_dataset/'
raw_data_dir: ''

# Path to the SAVEROAD_DataLoader toolkit folder (needed for camera projection figures).
# Leave empty to skip camera projection and only generate prediction mosaic plots.
saveroad_dir: ''   # e.g. '/media/SSD2/SAVEROAD_DataLoader'

subfolders:
  rad_power: rad_power
  rad_elev:  rad_elev
  labels:    labels
  pco:       pco
  calib:     calib
  cfar:      cfar

normalization:
  enable: true
  auto_normalization: false
  power_log_transform: true
  power_min_val: -100.0
  power_max_val: -31.7
  normalize_elevation: false
  elevation_max_angle: 0.7854
  mask_elevation: false
  power_threshold: -60.0

eval_mode: basic

basic:
  dataset:   'RC019'   # single RC folder to check
  threshold: 0.4

thesis_plots:
  enable:         true
  n_plots:        5
  raw_prediction: true
  threshold:      0.4

out_dir: verification_output/basic
