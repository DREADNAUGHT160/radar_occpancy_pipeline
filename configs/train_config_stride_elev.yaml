# ─────────────────────────────────────────────────────────────────────────────
# FALLBACK EXPERIMENT — try this if max-pool training (train_config.yaml) does
# not learn well.  The only difference is elev_pool: stride instead of max.
# Steps:
#   1. python utils/prepool_elev.py --config configs/train_config_stride_elev.yaml --force
#   2. python train.py --config configs/train_config_stride_elev.yaml
# Checkpoints go to checkpoints_stride_elev/ so the max-pool run is untouched.
# ─────────────────────────────────────────────────────────────────────────────
experiment_name: radar_occupancy_stride_elev

dataset:
  raw_data_dir: ''
  base_dir: '/media/SSD2/radar_dataset/'

  subfolders:
    rad_power: rad_power
    rad_elev:  rad_elev
    labels:    labels
    pco:       pco
    calib:     calib

  auto_split:
    enabled: false
    train_ratio: 0.70
    val_ratio: 0.15
    seed: 42

  train:
    - RC002
    - RC003
    - RC004
    - RC005
    - RC006
    - RC007
    - RC008
    - RC014
    - RC015
    - RC016
    - RC020
    - RC021
    - RC022
    - RC029
    - RC030
    - RC041
    - RC042
    - RC043
    - RC050
    - RC051
    - RC052
    - RC053
    - RC054
    - RC063
    - RC062
    - RC064
    - RC065
    - RC066
    - RC067
    - RC068
    - RC069
    - RC070
    - RC071
    - RC072
    - RC073

  val:
    - RC011
    - RC012
    - RC013
    - RC009
    - RC010

  test:
    - RC019
    - RC032
    - RC033
    - RC031
    - RC036

  batch_size: 6
  num_workers: 4
  augmentations: true
  sync_threshold_ms: 100
  filter_bboxes: false
  label_text_dir: ''

  normalization:
    enable: true
    auto_normalization: false
    power_log_transform: true
    power_min_val: -100.0
    power_max_val: -31.7
    normalize_elevation: false
    elevation_max_angle: 0.7854
    no_clipping: false
    mask_elevation: false
    power_threshold: -60.0

model:
  name: resnet18_radar
  in_channels: 2
  doppler_depth: 128
  use_full_doppler: false
  encoder_out_channels: 64
  num_classes: 64
  doppler_pool: max
  # Elevation 4x downsampling method (512 -> 128):
  #   max    - F.max_pool3d kernel=(4,1,1) — biases toward positive (sky) angles [default]
  #   stride - arr[::4] — samples true angle at specific Doppler velocities, no bias
  elev_pool: stride

training:
  epochs: 10
  lr: 0.001
  optimizer: Adam
  weight_decay: 1e-4
  scheduler: CosineAnnealingLR
  loss: weighted_bce
  pos_weight: 10.0

logging:
  output_dir: checkpoints_stride_elev
  tensorboard: true

check_data:
  split:   train
  n_plots: 5

inference:
  checkpoint: ''
  threshold: null
  out_dir: verification_output_stride_elev
  saveroad_dir: ''
